<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(circle at 50% 30%, #2a1030 0%, #120618 70%, #000 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #sky {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }
  .heart {
    position: absolute;
    top: -40px;
    font-size: 22px;
    user-select: none;
    will-change: transform, opacity;
    filter: drop-shadow(0 0 6px rgba(255, 105, 180, 0.8));
    animation: fall linear forwards;
  }
  @keyframes fall {
    0%   { transform: translate(0, 0) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--dx), 105vh) rotate(360deg); opacity: 0; }
  }
  .stage {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 2;
  }
  #heart-btn {
    width: 120px;
    height: 120px;
    border: none;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ff8fb8, #ff2d6f 60%, #c2185b);
    color: #fff;
    font-size: 3rem;
    cursor: grab;
    box-shadow: 0 10px 40px rgba(255, 45, 111, 0.5),
                inset 0 2px 8px rgba(255, 255, 255, 0.4);
    transition: box-shadow 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    user-select: none;
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
  }
  #heart-btn.dragging {
    cursor: grabbing;
    box-shadow: 0 16px 50px rgba(255, 45, 111, 0.7),
                inset 0 2px 8px rgba(255, 255, 255, 0.4);
    transition: none;
  }
  @keyframes explode {
    0%   { transform: translate(-50%, -50%) scale(1); filter: brightness(1); }
    30%  { transform: translate(-50%, -50%) scale(1.5); filter: brightness(1.6); box-shadow: 0 0 60px 20px rgba(255, 255, 255, 0.6), 0 0 90px 40px rgba(255, 45, 111, 0.8); }
    70%  { transform: translate(-50%, -50%) scale(1.05); filter: brightness(1.2); }
    100% { transform: translate(-50%, -50%) scale(1); filter: brightness(1); }
  }
  .heart-btn.exploding {
    animation: explode 0.5s ease;
    transition: none;
  }
  #love-text {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.3);
    font-size: 5rem;
    font-weight: 800;
    color: #fff;
    text-shadow: 0 0 30px rgba(255, 45, 111, 0.9), 0 0 60px rgba(255, 105, 180, 0.6);
    z-index: 4;
    pointer-events: none;
    opacity: 0;
  }
  #love-text.show { animation: lovePop 1.4s ease forwards; }
  @keyframes lovePop {
    0%   { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
    20%  { transform: translate(-50%, -50%) scale(1.4); opacity: 1; filter: brightness(1.3); }
    60%  { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
  }
  .hint {
    position: fixed;
    bottom: 24px;
    width: 100%;
    text-align: center;
    color: rgba(255, 255, 255, 0.5);
    font-size: 0.9rem;
    z-index: 2;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div id="sky"></div>
  <div id="love-text">I LOVE YOU</div>
  <div class="stage">
    <button id="heart-btn" aria-label="Spread love">❤</button>
  </div>
  <div class="hint">Click the heart to shower the sky with love</div>

<script>
  const sky = document.getElementById('sky');
  const btn = document.getElementById('heart-btn');
  const loveText = document.getElementById('love-text');
  const hearts = '❤ 💖 💕 💘 💝 💞 💓 ❤️‍🔥 💗 💙 💚 💛'.split(' ');
  const colors = ['#ff2d6f', '#ff5e8a', '#ff8fb8', '#ff4d6d', '#f768a8', '#ff9fc5'];

  let raining = false;

  function spawnHeart() {
    const el = document.createElement('div');
    el.className = 'heart';
    el.textContent = hearts[Math.floor(Math.random() * hearts.length)];
    el.style.fontSize = (16 + Math.random() * 34) + 'px';
    el.style.color = colors[Math.floor(Math.random() * colors.length)];

    const w = window.innerWidth;
    const x = Math.random() * w;
    const drift = (Math.random() - 0.5) * 220;
    el.style.left = x + 'px';
    el.style.setProperty('--dx', drift + 'px');

    const dur = 2600 + Math.random() * 2400;
    el.style.animationDuration = dur + 'ms';

    sky.appendChild(el);
    setTimeout(() => el.remove(), dur + 200);
  }

  function startRain() {
    if (raining) return;
    raining = true;
    // Rain hearts forever, until the browser is closed
    setInterval(() => {
      const n = 3 + Math.floor(Math.random() * 4);
      for (let i = 0; i < n; i++) {
        setTimeout(spawnHeart, i * 80);
      }
    }, 400);
  }

  function explode() {
    btn.classList.add('exploding');
    setTimeout(() => btn.classList.remove('exploding'), 500);
    loveText.classList.remove('show');
    void loveText.offsetWidth; // restart animation
    loveText.classList.add('show');
  }

  btn.addEventListener('click', () => {
    explode();
    startRain();
  });

  // Keyboard support: Enter / Space triggers the explosion
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      explode();
      startRain();
    }
  });
</script>
</body>
</html>
